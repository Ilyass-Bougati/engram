name: Mobile

# Pull requests and pushes to main that touch the app run its checks. Pushing a tag like
# mobile-v0.2.0 also builds a signed Android release (APK and App Bundle), publishes it as a
# GitHub release, and checks that the iOS app compiles. See docs/mobile.md#releases.
on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
    tags: ["mobile-v*.*.*"]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The version the app is developed and tested with; bump it on purpose.
  FLUTTER_VERSION: 3.47.9

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter test

  android:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # The tag names the release, so it must agree with the version in pubspec.yaml.
      - name: Tag matches pubspec version
        id: version
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          test "mobile-v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A release signed with the debug key couldn't be updated by a properly signed one later,
      # so there is no fallback: without the upload key, the release stops here.
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets. See docs/mobile.md#releases."
            exit 1
          fi
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The run number only grows, so every release can be installed over the one before.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Collect files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/release/engram-${{ steps.version.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/release/engram-${{ steps.version.outputs.version }}.aab"
          cd "$RUNNER_TEMP/release" && sha256sum * > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Engram mobile $VERSION" \
            --notes "Android: install engram-$VERSION.apk on your phone, or upload the .aab to Google Play. Build ${{ github.run_number }}. SHA256SUMS lists the checksums."
      - name: Remove the key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

  # Distributing to iPhones needs an Apple developer account and signing; this only makes sure
  # every release still builds for iOS.
  ios:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
