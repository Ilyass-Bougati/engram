# Brings the schema to the version the image expects. The backend's initContainer waits for
# this to finish, so a rollout never serves against an old schema.
#
# A Job's pod template can't be changed in place: before applying a new image tag, delete
# the old Job (`kubectl -n engram delete job engram-migrate --ignore-not-found`). Finished
# Jobs also remove themselves after ttlSecondsAfterFinished.
apiVersion: batch/v1
kind: Job
metadata:
  name: engram-migrate
spec:
  ttlSecondsAfterFinished: 600
  # Postgres may still be starting on a fresh install; failed attempts retry with backoff.
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engram-migrate
        app.kubernetes.io/component: migration
        engram/db-client: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/l03x/engram-backend
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engram-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: engram-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              value: postgresql://engram:$(POSTGRES_PASSWORD)@postgres:5432/engram
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
