apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  # A fixed address in k3s's default service range (10.43.0.0/16), so things on the node
  # itself, which can't resolve cluster DNS, always find the API at 10.43.67.67:8000: the
  # Vite dev server, or cloudflared run as a host service. A Service's address can't be
  # changed in place, so an existing Service has to be deleted once to pick this up.
  clusterIP: 10.43.67.67
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # One replica, one worker: the login/refresh/invite rate limiter keeps its counters in
  # process memory. Recreate keeps a second pod from running alongside during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        engram/db-client: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: ghcr.io/l03x/engram-backend
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.cli", "wait-for-migrations", "--timeout", "600"]
          env: &env
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engram-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: engram-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              value: postgresql://engram:$(POSTGRES_PASSWORD)@postgres:5432/engram
          resources: &resources
            requests:
              memory: 160Mi
              cpu: 50m
            limits:
              memory: 384Mi
              cpu: "1"
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts: &mounts
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: ghcr.io/l03x/engram-backend
          imagePullPolicy: IfNotPresent
          env: *env
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # Liveness doesn't touch the database, so a Postgres restart doesn't restart the API.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources: *resources
          securityContext: *container-security
          volumeMounts: *mounts
      volumes:
        - name: tmp
          emptyDir: {}
