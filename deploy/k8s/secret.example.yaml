# Copy to secret.yaml (gitignored), fill in both values, and apply it after the namespace:
#
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
#   kubectl apply -f deploy/k8s/secret.yaml
#
# Generate each value with `openssl rand -hex 32`. POSTGRES_PASSWORD goes into a database URL
# unescaped, so keep it to URL-safe characters (hex is). JWT_SECRET must be at least 32
# characters; the backend refuses to start otherwise.
apiVersion: v1
kind: Secret
metadata:
  name: engram-secrets
  namespace: engram
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  JWT_SECRET: ""
