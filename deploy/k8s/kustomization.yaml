apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Secret is not listed here: it is applied by hand from secret.yaml, which is never
# committed (see secret.example.yaml and the README).
namespace: engram

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - backend.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: engram
    includeSelectors: false
    includeTemplates: true

# The release workflow moves `latest` to each new version. To hold the cluster on one version,
# or roll back, put that version here instead.
images:
  - name: ghcr.io/l03x/engram
    newTag: latest
