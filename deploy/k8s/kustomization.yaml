apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Secret is not listed here: it is applied by hand from secret.yaml, which is never
# committed (see secret.example.yaml and the README).
namespace: engram

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - migrate-job.yaml
  - backend.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: engram
    includeSelectors: false
    includeTemplates: true

images:
  - name: ghcr.io/l03x/engram-backend
    newTag: 0.1.0
